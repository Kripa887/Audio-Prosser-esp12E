[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200

lib_deps =
    SPI
    Wire
    EEPROM
    mathertel/RotaryEncoder
    tzapu/WiFiManager
    ESP Async WebServer
    ESPAsyncTCP
    arduino-libraries/ArduinoOTA
    crankyoldgit/IRremoteESP8266
    fastled/FastLED
    johnrickman/LiquidCrystal_I2C
    TDA7439

board_build.filesystem = littlefs
